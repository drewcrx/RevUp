services:

  # ── Traefik – proxy inverso y SSL automático ──────────────────────────────
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.file.filename=/config/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - ./traefik/dynamic.yml:/config/dynamic.yml:ro
    networks:
      - proxy

  # ── Portainer – gestión visual de contenedores ────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  # ── Adminer – administrador gráfico de base de datos ─────────────────────
  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - proxy
      - backend

  # ── Backend – API Node.js/Express ─────────────────────────────────────────
  backend:
    image: ghcr.io/drewcrx/revup-backend:latest
    build:
      context: ./api/revup-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 7d
      APP_URL: https://backrevup.byronrm.com
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM_NAME: RevUp
      MAIL_FROM_EMAIL: ${MAIL_USER}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
    networks:
      - proxy
      - backend

  # ── Frontend – Flutter Web servido con nginx ──────────────────────────────
  frontend:
    image: ghcr.io/drewcrx/revup-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - proxy

volumes:
  letsencrypt:
  portainer_data:
  postgres_data:
  uploads_data:

networks:
  proxy:
    external: false
  backend:
    external: false
