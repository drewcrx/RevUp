name: Validate RevUp and optional deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Desplegar al VPS de produccion configurado'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/drewcrx/revup-backend
  FRONTEND_IMAGE: ghcr.io/drewcrx/revup-frontend

jobs:
  build-and-push:
    name: Test and build web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/revup-api/package-lock.json

      - name: Backend tests
        working-directory: api/revup-api
        run: |
          npm ci
          npm test

      - name: Flutter build web
        env:
          API_BASE_URL: ${{ vars.REVUP_API_URL || 'https://api.revup.example' }}
        run: flutter build web --release --dart-define=APP_ENV=production --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.REVUP_API_URL != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.REVUP_API_URL != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.REVUP_API_URL != ''
        uses: docker/build-push-action@v6
        with:
          context: ./api/revup-api
          file: ./api/revup-api/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.REVUP_API_URL != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.REVUP_API_URL != ''

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/revup
            git fetch origin main
            git reset --hard origin/main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose restart traefik
            docker image prune -f
